[project]
name = "freecad-agent"
version = "0.1.0"
description = "An agent chat panel inside FreeCAD: Claude Code as the headless harness, local or cloud models via Ollama"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Rutwik Gulakala" }]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.159",
    "freecad-mcp==0.1.22",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "qtpy>=2.4.3",
    "vastai>=1.0.9",
]

[dependency-groups]
dev = [
    "pyside6>=6.11.2",
]
